name: CI

on:
  push:
    branches: [main, hosted, "*-dev"]
  pull_request:
    branches: [main, hosted, "*-dev"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile $(git ls-files '*.py')
      - run: pip install ruff==0.16.9 -r requirements.txt
      - run: ruff check bot supervisor lambda
      - run: for t in bot/test_*.py; do python "$t" || exit 1; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
